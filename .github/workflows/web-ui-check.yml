name: Web UI P1 validation (feature only)
on:
  push:
    branches: [feature/web-ui-v0-6]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sce-web-ui-dev
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Install matching Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          SOURCE=/root/.local/share/godot/export_templates/4.7.2.stable
          TARGET="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          if [ ! -d "$TARGET" ]; then
            test -d "$SOURCE"
            mkdir -p "$(dirname "$TARGET")"
            cp -a "$SOURCE" "$TARGET"
          fi
      - name: Fetch licensed Japanese UI font
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v curl >/dev/null 2>&1 || ! command -v python3 >/dev/null 2>&1; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends curl ca-certificates python3
          fi
          mkdir -p assets/fonts
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansjp/NotoSansJP%5Bwght%5D.ttf' \
            --output assets/fonts/NotoSansJP.ttf
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansjp/OFL.txt' \
            --output assets/fonts/OFL.txt
          test "$(stat -c %s assets/fonts/NotoSansJP.ttf)" -gt 1000000
          python3 - <<'PY'
          from pathlib import Path
          project = Path("project.godot")
          text = project.read_text(encoding="utf-8")
          assert "[gui]" in text
          text = text.replace("[gui]", '[gui]' + chr(10) + 'theme/custom_font="res://assets/fonts/NotoSansJP.ttf"', 1)
          project.write_text(text, encoding="utf-8")
          PY
      - name: Godot import
        run: godot --headless --path . --import
      - name: P1 touch state and navigation test
        run: godot --headless --path . --script res://tests/web_ui_p1_test.gd
      - name: P2 interactive battle regression
        run: godot --headless --path . --script res://tests/web_ui_p2_test.gd
      - name: P3 hub and solo departure regression
        env:
          SCE_WEB_UI_ISOLATED_TEST: "1"
        run: godot --headless --path . --script res://tests/web_ui_p3_test.gd
      - name: P4 warehouse, forge and merchant safety regression
        env:
          SCE_WEB_UI_ISOLATED_TEST: "1"
        run: godot --headless --path . --script res://tests/web_ui_p4_test.gd
      - name: P5 route, reward, services and defeat confirmation regression
        env:
          SCE_WEB_UI_ISOLATED_TEST: "1"
        run: godot --headless --path . --script res://tests/web_ui_p5_test.gd
      - name: P6 iPhone landscape hub geometry regression
        run: godot --headless --path . --script res://tests/web_ui_p6_hub_geometry_test.gd
      - name: Main-scene smoke test (20 seconds)
        shell: bash
        run: |
          set -euo pipefail
          timeout 20s godot --headless --path . --quit-after 100 || status=$?
          if [ "${status:-0}" = "124" ]; then echo "Timed out during startup"; exit 1; fi
          test "${status:-0}" = "0"
      - name: Export Web (single-threaded, no native extensions)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          test -s build/web/index.html
          test -n "$(find build/web -name '*.wasm' -print -quit)"
          cp assets/fonts/OFL.txt build/web/FONT_LICENSE_SIL_OFL.txt
          touch build/web/.nojekyll
      - name: Archive Web candidate without publishing
        uses: actions/upload-artifact@v4
        with:
          name: sce-web-ui-dev-candidate
          path: build/web
          retention-days: 7

  browser-layout:
    name: P6 landscape browser smoke and screenshots
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: sce-web-ui-dev-candidate
          path: site
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Smoke Web layout in browser
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site >/tmp/sce-browser-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in {1..30}; do
            if curl --fail -s http://127.0.0.1:8765/index.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/web_ui_browser_check.mjs
      - name: Upload screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sce-p6-browser-evidence
          path: browser-artifacts
          if-no-files-found: warn
          retention-days: 7
